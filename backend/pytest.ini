[pytest]
asyncio_mode = auto
# --cov=. : Enable coverage for current directory
# --cov-report=term-missing : Show missing lines in terminal
# --cov-fail-under=80 : Fail if coverage is under 80% (Uncomment to enforce quality gate)
addopts = -q --maxfail=1 --cov=. --cov-report=term-missing
testpaths = tests
