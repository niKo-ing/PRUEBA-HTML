<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TodoBarato</title>

    <!-- CSS mínimo para centrar el preloader -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fff;
        z-index: 9999;
        transition: opacity .25s ease, visibility .25s ease;
      }
      #preloader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="spinner-border text-warning" role="status" style="width:3rem;height:3rem">
        <span class="visually-hidden">Cargando…</span>
      </div>
    </div>

    <!-- React root -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
